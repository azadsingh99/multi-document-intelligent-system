services:
  postgres:
    image: postgres:16-alpine
    container_name: mdis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mdis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mdis_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mdis}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - mdis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mdis} -d ${POSTGRES_DB:-mdis}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mdis_pgdata:
